<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="#1B4FD8"/>
  
  <!-- Subtle gradient overlay -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" opacity="0.4"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F8EF7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1B4FD8;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Bar chart bars -->
  <rect x="80" y="300" width="64" height="140" rx="12" fill="white" opacity="0.3"/>
  <rect x="168" y="240" width="64" height="200" rx="12" fill="white" opacity="0.5"/>
  <rect x="256" y="180" width="64" height="260" rx="12" fill="white" opacity="0.7"/>
  <rect x="344" y="120" width="64" height="320" rx="12" fill="white" opacity="0.9"/>

  <!-- Trend line -->
  <polyline points="112,290 200,230 288,170 376,110"
    fill="none" stroke="#86EFAC" stroke-width="18"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dots on trend line -->
  <circle cx="112" cy="290" r="14" fill="#86EFAC"/>
  <circle cx="200" cy="230" r="14" fill="#86EFAC"/>
  <circle cx="288" cy="170" r="14" fill="#86EFAC"/>
  <circle cx="376" cy="110" r="18" fill="white"/>
  <circle cx="376" cy="110" r="10" fill="#86EFAC"/>
</svg>